<title>Advisory Board Marquee</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a white section with the same faint grid as the comp.
   Header and pager language follow sections 3 and 4 (same blue, same light headline, same pad).
   Under the header, three rows of advisor pills and blue logo circles drift sideways in alternating directions.
   Everything is prefixed as- so it can sit in the same document as the other sections without collisions. */
:root {
  --blue: #0648e6;
  --white: #ffffff;
  --white-dim: rgba(255, 255, 255, .86);
  --font: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --pad: max(7.6vw, 20px);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); -webkit-font-smoothing: antialiased; }

.as {
  --as-ink: #0b1020;
  --as-dim: #596077;
  --as-line: #eceef4;
  --as-pill: #f0f1f5;
  --as-pill-h: clamp(52px, 4.4vw, 68px);
  --as-gap: clamp(10px, 1vw, 16px);
  --as-h: clamp(1.9rem, min(4.3vw, 6.2vh), 3.4rem);
  position: relative; overflow: hidden; height: max(100vh, 700px);
  background: #fff; color: var(--as-ink); font-family: var(--font);
}

/* The grid: three vertical hairlines at quarter points and two horizontal ones */
.as-grid {
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(var(--as-line), var(--as-line)), linear-gradient(var(--as-line), var(--as-line)), linear-gradient(var(--as-line), var(--as-line)),
    linear-gradient(var(--as-line), var(--as-line)), linear-gradient(var(--as-line), var(--as-line));
  background-repeat: no-repeat;
  background-size: 1px 100%, 1px 100%, 1px 100%, 100% 1px, 100% 1px;
  background-position: 25% 0, 50% 0, 75% 0, 0 17%, 0 83%;
}

.as-head {
  position: absolute; z-index: 2; top: calc(17% + clamp(12px, 1.6vh, 20px));
  left: max(var(--pad), env(safe-area-inset-left, 0px));
  right: max(var(--pad), env(safe-area-inset-right, 0px));
}
.as-headline { margin: 0; color: var(--blue); font-weight: 300; font-size: var(--as-h); line-height: 1.07; letter-spacing: -.012em; }
.as-copy { margin-top: calc(var(--as-h) * .62); display: flex; align-items: center; flex-wrap: wrap; gap: 20px clamp(28px, 4.2vw, 80px); }
.as-sub { margin: 0; max-width: 34em; font-weight: 300; font-size: clamp(11px, 1.2vw, 14px); line-height: 1.28; color: var(--as-ink); }
.as-btn {
  display: inline-flex; align-items: center; justify-content: center; white-space: nowrap;
  background: var(--blue); color: var(--white); text-decoration: none; cursor: pointer;
  padding: .78em 1.55em; border-radius: 999px; font: 500 clamp(10px, 1.05vw, 12px)/1 var(--font);
  transition: background .3s;
}
.as-btn:hover { background: #0a3bbd; }
.as-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

/* Marquee */
.as-marquee {
  position: absolute; z-index: 1; left: 0; right: 0; top: 51%;
  display: grid; gap: var(--as-gap);
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 5%, #000 95%, transparent 100%);
          mask-image: linear-gradient(90deg, transparent 0, #000 5%, #000 95%, transparent 100%);
}
.as-row { overflow: hidden; height: var(--as-pill-h); }
.as-track { display: flex; width: max-content; will-change: transform; animation-duration: var(--as-dur, 70s); animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: var(--as-delay, 0s); }
.as-row[data-dir="left"] .as-track { animation-name: as-left; }
.as-row[data-dir="right"] .as-track { animation-name: as-right; }
.as-row:hover .as-track { animation-play-state: paused; }
@keyframes as-left  { to { transform: translate3d(calc(var(--as-shift) * -1), 0, 0); } }
@keyframes as-right { from { transform: translate3d(calc(var(--as-shift) * -1), 0, 0); } to { transform: translate3d(0, 0, 0); } }
.as-set { flex: none; display: flex; align-items: center; gap: var(--as-gap); padding-right: var(--as-gap); }

.as-pill {
  flex: none; display: flex; align-items: center; white-space: nowrap;
  gap: calc(var(--as-pill-h) * .2); height: var(--as-pill-h); border-radius: 999px; background: var(--as-pill);
  padding: calc(var(--as-pill-h) * .125) calc(var(--as-pill-h) * .42) calc(var(--as-pill-h) * .125) calc(var(--as-pill-h) * .125);
  transition: background .3s;
}
.as-pill:hover { background: #e7e9f0; }
.as-ph { display: block; flex: none; width: calc(var(--as-pill-h) * .75); height: calc(var(--as-pill-h) * .75); border-radius: 50%; object-fit: cover; background: #fff; }
.as-txt { display: flex; flex-direction: column; justify-content: center; }
.as-name { font-weight: 600; font-size: max(12.5px, calc(var(--as-pill-h) * .24)); line-height: 1.15; letter-spacing: -.005em; }
.as-suf { font-weight: 400; color: var(--as-dim); }
.as-cred { margin-top: calc(var(--as-pill-h) * .05); font-size: max(10.5px, calc(var(--as-pill-h) * .19)); line-height: 1.2; color: var(--as-dim); }

.as-logo { flex: none; display: grid; place-items: center; overflow: hidden; width: var(--as-pill-h); height: var(--as-pill-h); border-radius: 50%; background: var(--blue); color: var(--white); }
.as-mark { padding: 0 8%; text-align: center; text-transform: uppercase; font-weight: 600; letter-spacing: .08em; line-height: 1.15; font-size: max(7.5px, calc(var(--as-pill-h) * .125)); }
.as-logo img { display: block; width: 56%; height: 56%; object-fit: contain; filter: brightness(0) invert(1); }

@media (prefers-reduced-motion: reduce) { .as-track { animation: none; } }

/* Narrow screens: header flows normally and the marquee follows it */
@media (max-width: 760px) {
  .as { height: auto; min-height: 100svh; padding-bottom: clamp(56px, 10svh, 96px); --as-h: clamp(1.6rem, 7.4vw, 2.3rem); }
  .as-head { position: relative; top: auto; left: auto; right: auto; padding: clamp(72px, 14svh, 120px) max(var(--pad), 20px) 0; }
  .as-headline br { display: none; }
  .as-copy { flex-direction: column; align-items: flex-start; }
  .as-sub { font-size: 13px; }
  .as-btn { font-size: 12px; }
  .as-marquee { position: relative; top: auto; margin-top: clamp(40px, 7svh, 64px); }
}
</style>

<section class="as" id="as-section" aria-labelledby="as-headline">
  <div class="as-grid" aria-hidden="true"></div>

  <div class="as-head">
    <h2 class="as-headline" id="as-headline">Shaped by the people who answer<br> to care at the highest level.</h2>
    <div class="as-copy">
      <p class="as-sub">Our advisory board holds roles at clubs, leagues, hospitals, and universities where a decision about a record has consequences.</p>
      <a class="as-btn" id="as-btn" href="#">Meet the advisory board</a>
    </div>
  </div>

  <div class="as-marquee" id="as-marquee" role="group" aria-label="Global advisory board">
    <div class="as-row" data-dir="left"><div class="as-track"></div></div>
    <div class="as-row" data-dir="right"><div class="as-track"></div></div>
    <div class="as-row" data-dir="left"><div class="as-track"></div></div>
  </div>
</section>

    { speed: 28, seed: 0.37, seq: ['p:siebert', 'l:uw', 'p:carr', 'l:usnavy', 'l:nfl', 'p:auerbach', 'l:jaguars', 'l:sfg10', 'p:mcconville', 'l:chiefs', 'l:seahawks'] },
    { speed: 40, seed: 0.64, seq: ['p:nerrie', 'l:northwestern', 'l:stanford', 'p:murphy', 'l:colorado', 'l:arizona', 'p:anderson', 'l:usopc', 'l:rmr'] }
  ];

  /* ---------- Build ---------- */
  var section = document.getElementById('as-section');
  var rowEls = document.querySelectorAll('#as-marquee .as-row');
  var loaded = {};

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function makePill(id) {
    var p = PEOPLE[id], pill = el('div', 'as-pill');
    var img = el('img', 'as-ph'); img.src = PHOTOS[id]; img.alt = ''; img.draggable = false;
    var txt = el('div', 'as-txt');
    var name = el('div', 'as-name', p.name); name.appendChild(el('span', 'as-suf', ', ' + p.suffix));
    txt.appendChild(name); txt.appendChild(el('div', 'as-cred', p.cred));
    pill.appendChild(img); pill.appendChild(txt);
    return pill;
  }

  function logoImg(key) { var i = el('img'); i.src = LOGO_DIR + LOGOS[key].file; i.alt = ''; i.draggable = false; return i; }

  function makeLogo(key) {
    var d = LOGOS[key], c = el('div', 'as-logo');
    c.setAttribute('role', 'img'); c.setAttribute('aria-label', d.name); c.setAttribute('data-logo', key);
    c.appendChild(loaded[key] ? logoImg(key) : el('span', 'as-mark', d.mark));
    return c;
  }

  /* Look for each logo file once; when one exists, upgrade every circle that uses it */
  function probeLogos() {
    if (!LOGO_DIR) return;
    Object.keys(LOGOS).forEach(function (key) {
      var t = new Image();
      t.onload = function () {
        loaded[key] = true;
        [].forEach.call(document.querySelectorAll('.as-logo[data-logo="' + key + '"]'), function (c) { c.textContent = ''; c.appendChild(logoImg(key)); });
      };
      t.src = LOGO_DIR + LOGOS[key].file;
    });
  }

  var builtAt = 0;
  function build() {
    var vw = section.clientWidth || window.innerWidth;
    builtAt = vw;
    [].forEach.call(rowEls, function (row, i) {
      var def = ROWS[i], track = row.firstElementChild;
      track.textContent = '';
      var set = el('div', 'as-set');
      def.seq.forEach(function (tok) { var p = tok.split(':'); set.appendChild(p[0] === 'p' ? makePill(p[1]) : makeLogo(p[1])); });
      track.appendChild(set);
      var w = set.getBoundingClientRect().width;     // one full set, trailing gap included
      var copies = Math.ceil(vw / w) + 1;            // enough sets that the row never shows an edge
      for (var k = 1; k < copies; k++) {
        var c = set.cloneNode(true); c.setAttribute('aria-hidden', 'true'); c.setAttribute('inert', ''); track.appendChild(c);
      }
      var dur = w / def.speed;
      track.style.setProperty('--as-shift', w + 'px');
      track.style.setProperty('--as-dur', dur.toFixed(2) + 's');
      track.style.setProperty('--as-delay', (-def.seed * dur).toFixed(2) + 's');
    });
  }

  /* The button has no destination yet */
  document.getElementById('as-btn').addEventListener('click', function (e) { if (this.getAttribute('href') === '#') e.preventDefault(); });

  build();
  probeLogos();

  var t = 0;
  function onResize() {
    clearTimeout(t);
    t = setTimeout(function () { if (Math.abs((section.clientWidth || 0) - builtAt) > 2) build(); }, 150);
  }
  if (window.ResizeObserver) new ResizeObserver(onResize).observe(section); else window.addEventListener('resize', onResize);
})();
</script>

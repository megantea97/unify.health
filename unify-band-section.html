<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unify.Health Band Section</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Stand-in for Urbane. Swap the font-family below when the brand font is licensed for web. -->
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#024CEB;
    --navy:#050924;
    --white:#FFFFFF;
    --f-display:"Urbane","Urbanist",system-ui,Arial,sans-serif;
    --gutter:clamp(16px,3.2vw,48px);
    --line:rgba(5,9,36,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--white);color:var(--navy);-webkit-font-smoothing:antialiased}

  /* Section */
  .band{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    padding:0 var(--gutter);
    background:var(--white);
    overflow:clip;
  }

  /* Hairline grid: 4 columns plus horizontals at 17% and 83% */
  .band::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
      linear-gradient(to right,var(--line) 1px,transparent 1px) 0 0/25% 100%,
      linear-gradient(var(--line),var(--line)) 0 17%/100% 1px no-repeat,
      linear-gradient(var(--line),var(--line)) 0 83%/100% 1px no-repeat;
  }

  .scatter{
    position:relative;
    margin:0;
    max-width:12.5em;
    font:500 clamp(38px,7.4vw,124px)/1.02 var(--f-display);
    letter-spacing:-.03em;
    color:var(--navy);
  }
  .scatter .w{display:inline-block;white-space:nowrap}
  .scatter .b{color:var(--blue)}
  .scatter .ch{
    display:inline-block;
    transition:transform 1.1s cubic-bezier(.16,1,.3,1),opacity .9s ease;
    transition-delay:calc(var(--i) * 18ms);
  }
  /* Letters start scattered, then settle when the section scrolls into view */
  .scatter:not(.in) .ch{
    opacity:0;
    transform:translate(var(--x),var(--y)) rotate(var(--r));
  }

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (prefers-reduced-motion:reduce){
    .scatter .ch{transition:none}
    .scatter:not(.in) .ch{opacity:1;transform:none}
  }
</style>
</head>
<body>

<section class="band" id="band" aria-labelledby="band-text">
  <p class="scatter" id="bandText" aria-hidden="true">
    <span class="b">Connection</span> is what we build. <span class="b">Continuity</span> is the outcome.
  </p>
  <p class="sr" id="band-text">Connection is what we build. Continuity is the outcome.</p>
</section>

<script>
(() => {
  const el = document.getElementById('bandText');

  // Seeded random so the scatter looks the same every load
  let seed = 7;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  // Split text into words and letters, keeping the blue spans
  let n = 0;
  const splitNode = (node) => {
    const frag = document.createDocumentFragment();
    node.childNodes.forEach(child => {
      if (child.nodeType === 3) {
        child.textContent.split(/(\s+)/).forEach(part => {
          if (!part) return;
          if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(' ')); return; }
          frag.appendChild(wordOf(part));
        });
      } else if (child.nodeType === 1) {
        const clone = child.cloneNode(false);
        clone.appendChild(wordOf(child.textContent));
        frag.appendChild(clone);
      }
    });
    return frag;
  };
  const wordOf = (text) => {
    const w = document.createElement('span'); w.className = 'w';
    [...text].forEach(c => {
      const s = document.createElement('span'); s.className = 'ch'; s.textContent = c;
      s.style.setProperty('--i', n++);
      s.style.setProperty('--x', ((rnd() - .5) * 260).toFixed(0) + 'px');
      s.style.setProperty('--y', ((rnd() - .5) * 220).toFixed(0) + 'px');
      s.style.setProperty('--r', ((rnd() - .5) * 70).toFixed(0) + 'deg');
      w.appendChild(s);
    });
    return w;
  };
  const out = splitNode(el);
  el.textContent = '';
  el.appendChild(out);

  // Settle when in view
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { el.classList.add('in'); io.disconnect(); } });
  }, { threshold: .35 });
  io.observe(el);
})();
</script>
</body>
</html>

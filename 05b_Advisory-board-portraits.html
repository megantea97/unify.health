<title>Advisory Board Portraits</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&display=swap" rel="stylesheet">
<style>
/* Layout: the same white section, header and button as the marquee version (05).
   Under the header, one row of large black and white portraits drifts slowly to the left on its own.
   Drag, swipe, trackpad or arrow keys flick it in either direction, and it loops with no end.
   Names, designations and credentials are set in Fragment Mono. Everything is prefixed pv- so it can sit in the
   same document as the other sections without collisions. */
:root {
  --blue: #0648e6;
  --white: #ffffff;
  --font: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --mono: 'Fragment Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --pad: max(7.6vw, 20px);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); -webkit-font-smoothing: antialiased; }

.pv {
  --pv-ink: #0b1020;
  --pv-dim: #596077;
  --pv-line: #eceef4;
  --pv-h: clamp(1.9rem, min(4.3vw, 6.2vh), 3.4rem);
  --pv-w: clamp(250px, 23vw, 400px);           /* one column, rule and breathing room included */
  --pv-min: max(100vh, 800px);
  --pv-pw: calc(var(--pv-w) - 38px);           /* the portrait inside it */
  position: relative; overflow: hidden; background: #fff; color: var(--pv-ink); font-family: var(--font);
  min-height: var(--pv-min);
  display: flex; flex-direction: column;
  padding-top: calc(var(--pv-min) * .17 + clamp(12px, 1.6vh, 20px));
  padding-bottom: clamp(40px, 6vh, 72px);
}

/* One hairline under the top of the header, as in 05 */
.pv-grid {
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background: linear-gradient(var(--pv-line), var(--pv-line)) 0 calc(var(--pv-min) * .17) / 100% 1px no-repeat;
}

.pv-head { position: relative; z-index: 2; padding: 0 max(var(--pad), env(safe-area-inset-right, 0px)) 0 max(var(--pad), env(safe-area-inset-left, 0px)); }
.pv-eyebrow { display: flex; gap: 10px; align-items: center; margin: 0 0 clamp(10px, 1.4vh, 16px); font-size: clamp(10px, 1.05vw, 12px); letter-spacing: .01em; color: var(--pv-ink); }
.pv-eyebrow .pv-bar { opacity: .8; }
.pv-headline { margin: 0; color: var(--blue); font-weight: 300; font-size: var(--pv-h); line-height: 1.07; letter-spacing: -.012em; }
.pv-copy { margin-top: calc(var(--pv-h) * .62); display: flex; align-items: center; flex-wrap: wrap; gap: 20px clamp(28px, 4.2vw, 80px); }
.pv-sub { margin: 0; max-width: 34em; font-weight: 300; font-size: clamp(11px, 1.2vw, 14px); line-height: 1.28; color: var(--pv-ink); }
.pv-btn {
  display: inline-flex; align-items: center; justify-content: center; white-space: nowrap;
  background: var(--blue); color: var(--white); text-decoration: none; cursor: pointer;
  padding: .78em 1.55em; border-radius: 999px; font: 500 clamp(10px, 1.05vw, 12px)/1 var(--font);
  transition: background .3s;
}
.pv-btn:hover { background: #0a3bbd; }
.pv-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

/* The strip of portraits */
.pv-view {
  position: relative; z-index: 1; flex: 1 1 auto; margin-top: clamp(28px, 5vh, 56px);
  overflow: hidden; cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; outline: none;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 5%, #000 95%, transparent 100%);
          mask-image: linear-gradient(90deg, transparent 0, #000 5%, #000 95%, transparent 100%);
}
.pv-view.pv-drag { cursor: grabbing; }
.pv-view:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; -webkit-mask-image: none; mask-image: none; }
.pv-track { display: flex; align-items: stretch; width: max-content; min-height: 100%; will-change: transform; }

.pv-col {
  position: relative; flex: none; width: var(--pv-w); margin: 0;
  padding: 0 22px 0 16px; border-left: 1px solid var(--blue);
}
.pv-ph { width: 100%; height: min(calc(var(--pv-pw) * .904), 36vh); overflow: hidden; background: #fff; }
.pv-ph img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 100%; filter: grayscale(1); -webkit-user-drag: none; pointer-events: none; }
.pv-cap { padding-top: clamp(12px, 1.8vh, 18px); font-family: var(--mono); font-weight: 400; }
.pv-name { font-size: clamp(13px, 1.1vw, 16px); line-height: 1.25; letter-spacing: -.01em; color: var(--pv-ink); }
.pv-des { margin-top: 2px; font-size: clamp(11.5px, .95vw, 14px); line-height: 1.25; color: var(--pv-dim); }
.pv-cr { margin: clamp(10px, 1.5vh, 14px) 0 0; padding: 0; list-style: none; font-size: clamp(10px, .78vw, 11.5px); line-height: 1.45; color: var(--pv-dim); }
.pv-cr li + li { margin-top: .5em; }

/* Real list for screen readers; the moving strip is hidden from them */
.pv-sr { position: fixed; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* Narrow screens: header flows normally and the strip follows it */
@media (max-width: 760px) {
  .pv { --pv-w: clamp(230px, 68vw, 330px); --pv-h: clamp(1.6rem, 7.4vw, 2.3rem); min-height: 100svh; padding-top: clamp(72px, 14svh, 120px); padding-bottom: clamp(48px, 8svh, 80px); }
  .pv-grid { display: none; }
  .pv-headline br { display: none; }
  .pv-copy { flex-direction: column; align-items: flex-start; }
  .pv-sub { font-size: 13px; }
  .pv-btn { font-size: 12px; }
  .pv-ph { height: min(calc(var(--pv-pw) * .904), 34svh); }
  .pv-cr { font-size: 10.5px; }
}
</style>

<section class="pv" id="pv-section" aria-labelledby="pv-headline">
  <div class="pv-grid" aria-hidden="true"></div>

  <div class="pv-head">
    <p class="pv-eyebrow"><span>&Oslash;1</span><span class="pv-bar">|</span><span>Who we are</span></p>
    <h2 class="pv-headline" id="pv-headline">Shaped by the people who answer<br> to care at the highest level.</h2>
    <div class="pv-copy">
      <p class="pv-sub">Our advisory board holds roles at clubs, leagues, hospitals, and universities where a decision about a record has consequences.</p>
      <a class="pv-btn" id="pv-btn" href="#">Meet the advisory board</a>
    </div>
  </div>

  <div class="pv-view" id="pv-view" tabindex="0" role="region" aria-roledescription="carousel" aria-label="Global advisory board. Drag or use the left and right arrow keys to browse.">
    <div class="pv-track" id="pv-track" aria-hidden="true"></div>
  </div>
  <ul class="pv-sr" id="pv-sr" aria-label="Global advisory board"></ul>
</section>

    pos -= e.clientX - lx; lx = e.clientX; wrap(); paint();
    hist.push({ x: e.clientX, t: e.timeStamp });
    while (hist.length > 2 && e.timeStamp - hist[0].t > 90) hist.shift();
  });
  function release(e) {
    if (!armed || (e && e.pointerId !== pid)) return;
    armed = false;
    if (dragging) {
      dragging = false; view.classList.remove('pv-drag');
      var a = hist[0], b = hist[hist.length - 1], v = 0;
      if (a && b && b.t > a.t && e && e.type !== 'pointercancel' && e.timeStamp - b.t < 80) v = -(b.x - a.x) / ((b.t - a.t) / 1000);
      vel = Math.max(-MAX_VEL, Math.min(MAX_VEL, v));
      kick();
    }
    hist = [];
  }
  view.addEventListener('pointerup', release);
  view.addEventListener('pointercancel', release);
  view.addEventListener('lostpointercapture', release);
  view.addEventListener('dragstart', function (e) { e.preventDefault(); });
  view.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') { hovering = true; kick(); } });
  view.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse' && !armed) { hovering = false; kick(); } });

  /* Trackpad sideways swipes and shift plus wheel; plain vertical wheel still scrolls the page */
  view.addEventListener('wheel', function (e) {
    var dx = e.deltaX;
    if (e.shiftKey && !dx) dx = e.deltaY;
    if (!dx || (!e.shiftKey && Math.abs(e.deltaX) < Math.abs(e.deltaY))) return;
    e.preventDefault();
    if (e.deltaMode === 1) dx *= 16;
    pos += dx; vel = 0; wrap(); paint(); kick();
  }, { passive: false });

  /* Arrow keys move about one portrait at a time */
  view.addEventListener('keydown', function (e) {
    var dir = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (!dir) return;
    e.preventDefault();
    vel = dir * step * EASE_BACK * 1.02; kick();
  });
  view.addEventListener('focus', function () { focused = true; kick(); });
  view.addEventListener('blur', function () { focused = false; kick(); });

  /* Rest while off screen */
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (es) { onScreen = es[0].isIntersecting; kick(); }, { threshold: 0 }).observe(document.getElementById('pv-section'));
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) kick(); });

  var rt = 0;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () { var ratio = step ? pos / setW : 0; build(); pos = ratio * setW; wrap(); paint(); }, 120);
  });

  document.getElementById('pv-btn').addEventListener('click', function (e) { if (this.getAttribute('href') === '#') e.preventDefault(); });

  build(); paint(); kick();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { var r = pos / setW; build(); pos = r * setW; wrap(); paint(); });
})();
</script>
